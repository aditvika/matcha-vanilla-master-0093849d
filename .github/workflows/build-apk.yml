name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: |
          npm run build
          test -d .output/public || { echo "Build output missing: .output/public"; exit 1; }
          ls -lh .output/public 
          
      
      - name: Generate SPA index.html for Capacitor
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".output/public/assets");
            const js = files.find(f => f.endsWith(".js") && f.includes("index"));
            const css = files.find(f => f.endsWith(".css"));
            const html = `<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>MVMaster X</title>
              \${css ? \`<link rel="stylesheet" crossorigin href="./assets/\${css}">\` : ""}
            </head>
            <body>
              <div id="root"></div>
              \${js ? \`<script type="module" crossorigin src="./assets/\${js}"></script>\` : ""}
            </body>
            </html>`;
            fs.writeFileSync(".output/public/index.html", html);
            console.log("Generated index.html successfully!");
          '
      
      - name: Add or sync Capacitor Android platform
        run: |
          ./node_modules/.bin/cap --version
          if [ -d "android" ]; then
            ./node_modules/.bin/cap sync android
          else
            ./node_modules/.bin/cap add android
            ./node_modules/.bin/cap sync android
          fi

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmaster-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
