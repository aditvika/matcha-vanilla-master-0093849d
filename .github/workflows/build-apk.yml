name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: |
          npm run build
          test -d dist/client || { echo "Build output missing: dist/client"; exit 1; }
          ls -lh dist/client

      # The app builds as an SSR bundle (no static index.html), so render the
      # splash route once via `vite preview` and save it as the static shell
      # that Capacitor uses as its entry point.
      - name: Generate static index.html shell
        run: |
          cat > dist/server/server.js <<'EOF'
          import mod from "./index.mjs";

          export default {
            fetch(req, env, ctx) {
              const extra = {};
              const proxy = new Proxy(req, {
                get(t, k) {
                  if (k in extra) return extra[k];
                  const v = Reflect.get(t, k);
                  return typeof v === "function" ? v.bind(t) : v;
                },
                set(t, k, v) { extra[k] = v; return true; },
                has(t, k) { return k in extra || k in t; },
              });
              return mod.fetch(proxy, env ?? {}, ctx ?? { waitUntil() {} });
            },
          };
          EOF
          npx vite preview --port 4173 >/tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          ok=0
          for i in $(seq 1 30); do
            curl -sf -o dist/client/index.html http://localhost:4173/ && { ok=1; break; }
            sleep 1
          done
          kill $PREVIEW_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "Failed to render static shell"; tail -30 /tmp/preview.log; exit 1
          fi
          grep -q '<div id="root">' dist/client/index.html || grep -qa 'assets/' dist/client/index.html || { echo "Static shell looks invalid"; exit 1; }
          ls -lh dist/client/index.html

      - name: Add or sync Capacitor Android platform
        run: |
          ./node_modules/.bin/cap --version
          if [ -d "android" ]; then
            ./node_modules/.bin/cap sync android
          else
            ./node_modules/.bin/cap add android
            ./node_modules/.bin/cap sync android
          fi

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmaster-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
