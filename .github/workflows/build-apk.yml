name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: |
          npm run build
          test -d .output/public || { echo "Build output missing: .output/public"; exit 1; }
          ls -lh .output/public

      # The app builds as an SSR bundle (no static index.html), so render the
      # splash route once via `vite preview` and save it as the static shell
      # that Capacitor uses as its entry point 
      
      - name: Add or sync Capacitor Android platform
        run: |
          ./node_modules/.bin/cap --version
          if [ -d "android" ]; then
            ./node_modules/.bin/cap sync android
          else
            ./node_modules/.bin/cap add android
            ./node_modules/.bin/cap sync android
          fi

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvmaster-x-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
